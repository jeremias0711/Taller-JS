<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simulador de Prestaciones Laborales</title>
<script> src="SeccionPago.js" </script>
<link rel="stylesheet" href="SeccionPago.css">
        
    </head>
    <body>
    <main class="contenedor">

        <div class="encabezado">

            <h1>Simulador de Prestaciones Laborales</h1>

            <p>
                Sistema de cálculo de obligaciones laborales en Colombia 2026
            </p>

        </div>

        <div class="datosDelUsuario">
                <label for="nombreCompleto">Nombre completo:</label>
                <input type="text" id="nombreCompleto" name="nombreCompleto" required>  

                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" required>

                <label for="tipoDocumento">Tipo de documento:</label>
                <select id="tipoDocumento" name="tipoDocumento" required>
                <label>Seleccione un tipo de documento</label>
                    <option value="CC">Cédula de Ciudadanía</option>
                    <option value="CE">Cédula de Extranjería</option>
                    <option value="TI">Tarjeta de Identidad</option>
                    <option value="PP">Pasaporte</option>
                    <option value="RC">Registro Civil</option>
                </select>

                <label for="numeroDocumento">Número de documento:</label>
                <input type="text" id="numeroDocumento" name="numeroDocumento" required>


        ></div>

        <div class="formulario">
            <h2>Ingrese los datos del trabajador</h2>

            <form id="datosTrabajador">

                <label for="salario">Salario mensual:</label>
                <input type="number" id="salario" name="salario" required>

                <label for="comisiones">Comisiones:</label>
                <input type="number" id="comisiones" name="comisiones" required>

                <label for="totalHorasExtra">Total de horas extras:</label>
                <input type="number" id="totalHorasExtra" name="totalHorasExtra" required>

                <label for="calificacionNiveldeRiesgo">Calificación del nivel de riesgo:</label>
                <select id="calificacionNiveldeRiesgo" name="calificacionNiveldeRiesgo" required>
                <label>Seleccione una calificación de nivel de riesgo</label>
                    <option value="1">Nivel 1 - Riesgo mínimo</option>
                    <option value="2">Nivel 2 - Riesgo bajo</option>
                    <option value="3">Nivel 3 - Riesgo medio</option>
                    <option value="4">Nivel 4 - Riesgo alto</option>
                    <option value="5">Nivel 5 - Riesgo máximo</option>
                </select>

                <button type="submit">Calcular Prestaciones</button>

            </form>
