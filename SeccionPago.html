<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simulador de Prestaciones Laborales</title>
<script> src="SeccionPago.js" </script>
    </head>
    <body>

    <main class="contenedor">

        <div class="datosDelUsuario">
                <label for="nombreCompleto">Nombre completo:</label>
                <input type="text" id="nombreCompleto" name="nombreCompleto" required>  

                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" required>

        ></div>
        <div class="encabezado">

            <h1>Simulador de Prestaciones Laborales</h1>

            <p>
                Sistema de cálculo de obligaciones laborales en Colombia 2026
            </p>

        </div>

        <div class="formulario">
            <h2>Ingrese los datos del trabajador</h2>

            <form id="datosTrabajador">

                <label for="salario">Salario mensual:</label>
                <input type="number" id="salario" name="salario" required>

                <label for="tiempo">Tiempo trabajado (en años):</label>
                <input type="number" id="tiempo" name="tiempo" required>

                <button type="submit">Calcular Prestaciones</button>

            </form>
